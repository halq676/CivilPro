<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivilPro v1.0</title>
     <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#27ae60">
    <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
    <link rel="apple-touch-icon" href="icono-192.png">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container">
        <header>
            <h1>🏗️ CivilPro</h1>
            <p>Cálculo de Materiales</p>
        </header>

        <main class="card">
            <div class="input-group">
                <label>Elemento:</label>
                <select id="tipoElemento" onchange="adaptarFormulario()">
                    <option value="Columna">Columna</option>
                    <option value="Viga">Viga</option>
                    <option value="Losa">Losa / Placa</option>
                    <option value="Zapata">Zapata</option>
                    <option value="Pared">Muro / Pared</option>
                </select>
            </div>

            <div id="grupo-ladrillo" class="input-group" style="display:none;">
                <label>Clase de Ladrillo:</label>
                <select id="claseLadrillo">
                    <option value="farol">Ladrillo Farol (16/m2)</option>
                    <option value="solido">Ladrillo Sólido (38/m2)</option>
                </select>
            </div>

            <div class="grid-inputs">
                <div class="input-group"><label id="labelLargo">Largo (m):</label><input type="number" id="largo" step="0.01"></div>
                <div class="input-group" id="contenedor-ancho"><label id="labelAncho">Ancho (m):</label><input type="number" id="ancho" step="0.01"></div>
                <div class="input-group"><label id="labelAlto">Alto (m):</label><input type="number" id="alto" step="0.01"></div>
                <div class="input-group"><label>Cantidad:</label><input type="number" id="cantidad" value="1"></div>
            </div>

            <div id="seccion-hierro">
                <hr>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label>Hierro Principal:</label>
                        <select id="diametro">
                            <option value='1/2"'>1/2"</option>
                            <option value='3/8"'>3/8"</option>
                            <option value='5/8"'>5/8"</option>
                        </select>
                    </div>
                    <div class="input-group"><label>Cant. Varillas:</label><input type="number" id="varillasCant" placeholder="4"></div>
                </div>
                <div class="grid-inputs">
                    <div class="input-group">
                        <label>Hierro Estribo:</label>
                        <select id="diametroEstribo">
                            <option value='1/4"'>1/4"</option>
                            <option value='3/8"'>3/8"</option>
                        </select>
                    </div>
                    <div class="input-group"><label>Separación (m):</label><input type="number" id="separacion" step="0.01" placeholder="0.15"></div>
                </div>
            </div>
            <button class="btn-main" onclick="calcular()">+ Añadir al Pedido</button>
        </main>

        <div id="historial-categorias"></div>
        <div id="contenedor-consolidado"></div>
    </div>
    
    <script src="app.js?v=2"></script>
</body>
</html>
